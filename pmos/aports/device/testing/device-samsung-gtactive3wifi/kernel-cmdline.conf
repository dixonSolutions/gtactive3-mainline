console=tty0
fbcon=rotate:3
loglevel=7
# Only the A55 cluster: no clock driver / CPU bring-up for the M3 cores yet
maxcpus=4
# No Exynos 9810 clock or power-domain drivers yet: keep what the
# bootloader enabled
clk_ignore_unused
pd_ignore_unused
# The S2MPS18 LDOs that the kernel may switch through ACPM (camera, SD card,
# grip, NFC) stay as the bootloader left them until the first ACPM
# regulator write has been proven on this board (gtactive3-mainline
# docs/TESTPLAN.md D3): no switching off of unused ones 30 s after boot.
regulator_ignore_unused
# The kernel pets the watchdog that the bootloader left running
# (WATCHDOG_HANDLE_BOOT_ENABLED) only until userspace opens it; if that never
# happens, stop after 120 s so the SoC resets instead of hanging silently.
watchdog.open_timeout=120
# Oopses are fatal (a panic reboots, see panic= below), so
# a half-dead kernel does not keep the watchdog alive.
oops=panic
# A task blocked for hung_task_timeout_secs (120 s) panics, and a panic
# reboots after 10 s: a hang before userspace (26102210: PID 1 waiting
# forever on a CPU never woken from C2) then reboots by itself and
# systemd-boot's boot counting falls back to the previous version.
hung_task_panic=1
panic=10
# Vendor firmware from the root partition (firmware-path.tmpfiles)
firmware_class.path=/var/lib/firmware
# Run the per-CPU work items that upstream marked power-hungry on any CPU
# that is awake instead of waking an idle one ("measurably lower power usage
# at the cost of small performance overhead", kernel-parameters.txt; the
# Kconfig default for it needs CONFIG_PM).
workqueue.power_efficient=1
# libcamera 0.7.2's simple pipeline only drives receivers it knows; until it
# carries ours (gtactive3-mainline patches/libcamera/0001) the CSIS driver
# reports a known name. On the command line, not in modprobe.d: the module
# loads from the initrd, before /usr/lib/modprobe.d is there (26102302:
# "no camera found" in Snapshot).
exynos9810_csis.mc_driver_name=qcom-camss
# Per-core C2 power-down for the A55 cores (cand/1026+: the suspend context
# hash fix for MT MPIDRs, drv/c2fix). Verified on 26102302: all four cores
# in C2 ~65 % of the time under normal use, battery -107 -> -71 mA screen on.
exynos9810_c2=1
