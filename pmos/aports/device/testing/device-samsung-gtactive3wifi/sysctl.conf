# Reboot 10 s after a panic, as panic=10 on the kernel command line asks:
# Alpine's 00-alpine.conf sets 120 s once userspace is up, which would keep
# a tablet that panicked (oops=panic, hung_task_panic=1) dead for two
# minutes before systemd-boot's boot counting can fall back.
kernel.panic = 10

# Real-time threads (vblank, touch and SPI IRQ threads, panfrost, PipeWire)
# must not ask for the top CPU clock at every wakeup: the mainline default
# of 1024 kept the little cluster at 1950 MHz while idle (~90 mA measured
# on the SM-T570 with the screen on). Android uses 0 as well.
kernel.sched_util_clamp_min_rt_default = 0
