# Galaxy Tab Active3 (SM-T570): A-Box UAIF0 -> RT5665 codec (headset jack,
# microphones) on PCM 0, A-Box UAIF1 -> RT5510 amplifier (speaker) on PCM 1.
# Codec routing as in the stock vendor/etc/mixer_paths.xml and
# mixer_gains.xml: headphones from DAC1 through the Stereo1 DAC mixer,
# main mic on IN3 (BST3), headset mic on IN1 (BST1), both into Stereo1 ADC.
# Jack detection (kernel: RT5665 JD1+JD2, IRQ on gpa2-2) drives
# "Headphones Jack" and "Headset Mic Jack": the headphones and the headset
# microphone are only offered while plugged in, and then win over the
# speaker and the internal microphone. The kernel mutes the speaker while
# anything is in the jack (JackHWMute), so PipeWire moves the default sink.

SectionVerb {
	EnableSequence [
		# playback: AIF1 -> DAC1 mixer -> Stereo1 DAC mixer -> DAC1
		cset "name='DAC L1 Mux' 'IF1 DAC1'"
		cset "name='DAC R1 Mux' 'IF1 DAC1'"
		cset "name='DAC1 MIXL DAC1 Switch' on"
		cset "name='DAC1 MIXR DAC1 Switch' on"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' on"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' on"
		cset "name='DAC L1 Source' 'Stereo1 DAC Mixer'"
		cset "name='DAC R1 Source' 'Stereo1 DAC Mixer'"
		cset "name='DAC1 Playback Volume' 167,167"
		cset "name='HPO Playback Switch' off"
		cset "name='Headphones Switch' off"

		# capture: RECMIX1 -> ADC1 -> Stereo1 ADC -> AIF1_1
		cset "name='Stereo1 ADC L Mux' 'ADC1 L'"
		cset "name='Stereo1 ADC R Mux' 'ADC1 R'"
		cset "name='Stereo1 ADC L1 Mux' 'ADC'"
		cset "name='Stereo1 ADC R1 Mux' 'ADC'"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' on"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' on"
		cset "name='STO1 ADC Capture Switch' on,on"
		cset "name='RECMIX1L BST1 Switch' off"
		cset "name='RECMIX1R BST1 Switch' off"
		cset "name='RECMIX1L BST3 Switch' off"
		cset "name='RECMIX1R BST3 Switch' off"
		cset "name='RECMIX1L CBJ Switch' off"
		cset "name='Main Mic Switch' off"
		cset "name='Sub Mic Switch' off"
		cset "name='Headset Mic Switch' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		# RT5510 "Digital Volume", -115.5 dB .. 0 dB
		PlaybackMixerElem "Digital"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphones Switch' on"
		cset "name='HPO Playback Switch' on"
	]
	DisableSequence [
		cset "name='HPO Playback Switch' off"
		cset "name='Headphones Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
		JackControl "Headphones Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='IN3 Boost Volume' 36"
		cset "name='STO1 ADC Capture Volume' 39,39"
		cset "name='RECMIX1L BST3 Switch' on"
		cset "name='RECMIX1R BST3 Switch' on"
		cset "name='Main Mic Switch' on"
	]
	DisableSequence [
		cset "name='Main Mic Switch' off"
		cset "name='RECMIX1L BST3 Switch' off"
		cset "name='RECMIX1R BST3 Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='IN1 Boost Volume' 37"
		cset "name='STO1 ADC Capture Volume' 28,28"
		cset "name='RECMIX1L BST1 Switch' on"
		cset "name='RECMIX1R BST1 Switch' on"
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='RECMIX1L BST1 Switch' off"
		cset "name='RECMIX1R BST1 Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},0"
		JackControl "Headset Mic Jack"
	}
}
