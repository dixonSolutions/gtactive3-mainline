# Automatic updates over a weak or mobile link: a download that breaks off
# (seen on the tablet: "Stream error in the HTTP/2 framing layer" halfway
# through the 700 MB /usr image) fails the whole run and leaves the slot
# partially installed, and sysupdate refuses that version again ("already
# acquired and partially installed. Vacuum it") until it is vacuumed;
# --cleanup=yes does not do it. So: vacuum after a failed run (it leaves a
# complete pending update alone) and try again 10 min later instead of at
# the next timer run (2 h). Verified with a cut-off download in QEMU.
[Unit]
StartLimitIntervalSec=3h
StartLimitBurst=4

[Service]
ExecStopPost=/bin/sh -c '[ "$$SERVICE_RESULT" = success ] || exec /usr/lib/systemd/systemd-sysupdate vacuum'
Restart=on-failure
RestartSec=10min
