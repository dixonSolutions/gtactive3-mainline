# SM-T570: the firmware speaks PSCI 0.1, so suspend to idle is the only
# sleep state, and there is no hibernation. Suspend stays off until the
# wake-up path has been proven on this tablet (a sleep the user cannot end
# strands it): gtactive3wifi-suspend-gate.service allows it per boot.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
SuspendState=freeze
