# TuneD "throughput-performance" (power-profiles-daemon "performance"
# through tuned-ppd) on the Galaxy Tab Active3: the stock profile without
# its server memory settings, which work against a 4 GB tablet swapping to
# zram (postmarketos-zram):
#  - vm.swappiness=10 would evict file pages (program code, read again from
#    flash) long before compressed anonymous memory; for in-memory swap the
#    kernel documentation (admin-guide/sysctl/vm.rst) recommends values
#    above 100, and postmarketos-zram sets 180
#  - dirty_bytes=40 % lets 1.5 GB of dirty pages pile up before writeback,
#    which then stalls every writer at once
#  - readahead of at least 4 MB per request multiplies the flash reads for
#    the random accesses of an interactive system
[main]
summary=Broadly applicable tuning that provides excellent performance (Galaxy Tab Active3: without the server memory settings)
include=throughput-performance

[sysctl]
drop=vm.swappiness

[vm]
drop=dirty_bytes,dirty_background_bytes

[disk]
drop=readahead
