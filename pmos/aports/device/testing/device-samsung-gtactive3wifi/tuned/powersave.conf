# TuneD "powersave" (power-profiles-daemon "power-saver" through tuned-ppd;
# GNOME and Phosh switch to it at low battery) on the Galaxy Tab Active3:
# the stock profile plus a CPU frequency cap at 1456 MHz, three quarters of
# the A55 maximum. Samsung's energy table for these cores (stock device
# tree, energy-costs/core-core1) puts the energy per cycle at the OPPs
# above 1456 MHz 25-34 % higher than at 1456 MHz; Samsung's own power
# saving mode limits the CPU to 70 %. TuneD restores the limit when another
# profile is selected.
[main]
summary=Optimize for low power consumption (Galaxy Tab Active3: A55 at 1456 MHz at most)
include=powersave

[sysfs_cpu_little]
type=sysfs
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1456000
