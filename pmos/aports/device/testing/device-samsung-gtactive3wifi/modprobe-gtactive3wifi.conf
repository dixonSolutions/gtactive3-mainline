# The USB controller and PHY must only be probed after the USB clock gates
# are forced on (no clock driver yet): gtactive3wifi-usb-prep.service loads
# them itself once the gates and the MAX77705 data switch are set. An
# explicit "modprobe NAME" ignores the blacklist, udev's alias autoload does
# not. (In the regular pmOS boot.img chain uniLoader sets the gates before
# Linux starts and the initramfs loads them from modules-initfs.)
blacklist dwc3_exynos
blacklist phy_exynos5_usbdrd

# The Duranium initrd carries every module but no firmware: drivers that need
# firmware must not load there (they fail and give up; brcmfmac then never
# creates wlan0). In the initrd, skip them; in the booted system load normally.
install brcmfmac /bin/sh -c '[ -e /etc/initrd-release ] || exec /sbin/modprobe --ignore-install brcmfmac $CMDLINE_OPTS'
install hci_uart /bin/sh -c '[ -e /etc/initrd-release ] || exec /sbin/modprobe --ignore-install hci_uart $CMDLINE_OPTS'
install btbcm /bin/sh -c '[ -e /etc/initrd-release ] || exec /sbin/modprobe --ignore-install btbcm $CMDLINE_OPTS'
