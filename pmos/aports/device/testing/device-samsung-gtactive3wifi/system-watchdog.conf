# U-Boot stops the cluster 0 watchdog that uniLoader arms, so nothing times
# out the boot. While the system runs, PID 1 pets /dev/watchdog0 (a frozen
# kernel or PID 1 resets the SoC), but there is no deadline for shutdown or
# reboot (overrides duranium-usb-debug's 40-duranium-usb-debug-watchdog.conf).
[Manager]
WatchdogDevice=/dev/watchdog0
RuntimeWatchdogSec=30s
RebootWatchdogSec=off
