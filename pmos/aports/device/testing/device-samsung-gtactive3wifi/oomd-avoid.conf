# The shell and the session leader (GNOME Shell, Phosh, gnome-session):
# when memory pressure in user@.service makes systemd-oomd kill a cgroup
# (ManagedOOMMemoryPressure=kill, systemd's user@.service defaults), it
# picks the leaf cgroup with the most reclaim, which with a few apps open
# can be the shell itself, ending the whole session. Prefer the apps (each
# in its own app-*.scope). systemd-oomd honours this for cgroups owned by
# the same user as the monitored user@.service.
[Service]
ManagedOOMPreference=avoid
