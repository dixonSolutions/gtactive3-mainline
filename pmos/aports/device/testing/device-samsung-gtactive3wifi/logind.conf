# SM-T570 tablet: a short press of the power key or closing the book cover
# (hall sensor, SW_LID) suspends, a long press powers off. Phosh and GNOME
# take these over with their own inhibitors while a session runs. While
# suspend is not allowed (sleep.conf.d), logind ignores the suspend request.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
IdleAction=ignore
