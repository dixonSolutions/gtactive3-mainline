# Build and publish the SM-T570 Duranium images.
#
# We maintain the kernel, the drivers and the device packages (pmos/,
# exported with scripts/pmos-export after an on-device test). Everything
# else is postmarketOS's: upstream duranium-build and pmaports at their
# newest commit, the userspace from the postmarketOS binary repositories.
#
# A build runs when postmarketOS publishes new Duranium images (their weekly
# build; checked daily) or when what we maintain changes, and publishes to
# the update channels in ci/channels: one GitHub release per channel, which
# is where the tablets' systemd-sysupdate looks (signed SHA256SUMS).
name: images

on:
  schedule:
    - cron: "30 17 * * *"
  push:
    branches: [main]
    paths:
      - "pmos/**"
      - "ci/**"
      - "!ci/pages*"
      - "!ci/bootchain/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and publish even if nothing changed"
        type: boolean
        default: false
      min_version:
        description: "Publish a version above this one (YYMMDDNN), e.g. the newest local build the tablets run"
        type: string
        default: ""

concurrency:
  group: images
  cancel-in-progress: false

# only the image jobs publish (releases, tags)
permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.s.outputs.build }}
      version: ${{ steps.s.outputs.version }}
      verified: ${{ steps.s.outputs.verified }}
      upstream: ${{ steps.s.outputs.upstream }}
      fingerprint: ${{ steps.s.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v5
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '' }}
          # the input, else the repository variable (Settings > Variables)
          MIN_VERSION: ${{ inputs.min_version || vars.MIN_VERSION }}
        run: |
          ci/state | tee -a "$GITHUB_OUTPUT"

  packages:
    needs: state
    if: needs.state.outputs.build == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      duranium_build: ${{ steps.prep.outputs.duranium_build }}
      pmaports: ${{ steps.prep.outputs.pmaports }}
    steps:
      - uses: actions/checkout@v5
      - id: prep
        run: ci/prepare
      - name: Kernel package cache
        id: kcache
        uses: actions/cache@v5
        with:
          path: kpkgs
          key: kernel-${{ hashFiles('pmos/aports/device/testing/linux-postmarketos-exynos9810/**', 'work/duranium-build/contrib/samsung-gtactive3wifi/pkgbuilder.Containerfile') }}
      - name: Build our packages
        run: |
          set -eu
          mkdir -p ci-root/build pkgs distfiles ccache
          list=$(cat pmos/aports/BUILD)
          if [ "${{ steps.kcache.outputs.cache-hit }}" = true ]; then
            echo "::notice::kernel from cache: $(ls kpkgs)"
            list=$(echo "$list" | grep -v linux-postmarketos-exynos9810)
          fi
          GTA3_ROOT=$PWD/ci-root PMAPORTS=$PWD/work/pmaports PKGS=$PWD/pkgs \
            DISTFILES=$PWD/distfiles CCACHE=$PWD/ccache JOBS=$(nproc) \
            sh work/duranium-build/contrib/samsung-gtactive3wifi/build-apks.sh $list
          if [ "${{ steps.kcache.outputs.cache-hit }}" = true ]; then
            cp kpkgs/*.apk pkgs/
          else
            mkdir -p kpkgs && cp pkgs/linux-postmarketos-exynos9810-*.apk kpkgs/
          fi
          ls -l pkgs
      - name: Keep the trees for the image jobs
        run: tar -cf trees.tar work
      - uses: actions/upload-artifact@v6
        with:
          name: packages
          path: |
            pkgs/*.apk
            trees.tar
          retention-days: 3

  image:
    needs: [state, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        ui: [phosh, gnome]
        channel: [release, dev]
    steps:
      - uses: actions/checkout@v5
      - name: Release channels only for a device-verified export
        id: gate
        run: |
          if [ "${{ matrix.channel }}" = release ] && [ "${{ needs.state.outputs.verified }}" != yes ]; then
            echo "::notice::pmos/ export not verified on the device (pmos/VERIFIED): no ${{ matrix.ui }} release image this time, dev channel only"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.gate.outputs.skip != 'yes'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af >/dev/null || true
          df -h /
      - name: arm64 emulation and user namespaces for mkosi
        if: steps.gate.outputs.skip != 'yes'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user-static binfmt-support erofs-utils
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/download-artifact@v7
        if: steps.gate.outputs.skip != 'yes'
        with:
          name: packages
      - name: Build the image
        if: steps.gate.outputs.skip != 'yes'
        env:
          UI: ${{ matrix.ui }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -eu
          tar -xf trees.tar
          ln -sfn "$PWD/work/pmaports" work/duranium-build/pmaports
          echo "${{ needs.state.outputs.version }}" > work/duranium-build/mkosi.version
          mkdir -p ci-root/build
          GTA3_ROOT=$PWD/ci-root PMAPORTS=$PWD/work/pmaports PKGS=$PWD/pkgs SKIP_APKS=1 FRESH=1 \
            sh work/duranium-build/contrib/samsung-gtactive3wifi/build-image.sh --profile=compressed
          ls -l work/duranium-build/mkosi.output/*/
      - name: Check the image (keyring, update channel, debug layer)
        if: steps.gate.outputs.skip != 'yes'
        run: |
          set -eu
          tag=$(sh ci/channels | awk -v u="${{ matrix.ui }}" -v c="${{ matrix.channel }}" '$1 == u && $2 == c { print $3 }')
          ci/check-image "work/duranium-build/mkosi.output/${tag%-dev}" "${{ needs.state.outputs.version }}" "${{ matrix.channel }}" "$tag"
      - name: Publish
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.skip != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.SYSUPDATE_SIGNING_KEY }}
          UI: ${{ matrix.ui }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ needs.state.outputs.version }}
        run: |
          set -eu
          [ -n "$KEY" ] || { echo "::warning::no SYSUPDATE_SIGNING_KEY secret, not publishing"; exit 0; }
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$KEY" | gpg --batch --import
          tag=$(sh ci/channels | awk -v u="$UI" -v c="$CHANNEL" '$1 == u && $2 == c { print $3 }')
          pre=
          [ "$CHANNEL" = dev ] && pre=prerelease
          kernel=$(sed -n 's/^_commit="\(.*\)"/\1/p' pmos/aports/device/testing/linux-postmarketos-exynos9810/APKBUILD)
          base=${tag%-dev}
          export NOTES="$(cat <<EOF
          Update channel **$tag** for the Samsung Galaxy Tab Active3 (SM-T570), postmarketOS Duranium, UI **$UI**$( [ "$CHANNEL" = dev ] && echo ', development build with the USB debug layer (root over USB without a password: for development tablets only)').

          Newest version: **$VERSION** (built $(date -u '+%Y-%m-%d %H:%M UTC')).

          - Install image: \`${base}_${VERSION}.raw.zst\` (see docs/RELEASES.md)
          - Installed tablets update from this release (\`updatectl update\`, or GNOME Software / phosh settings)
          - Kernel: gtactive3-mainline \`${kernel:0:12}\`, postmarketOS Duranium base \`${{ needs.state.outputs.upstream }}\`
          - duranium-build \`${{ needs.packages.outputs.duranium_build }}\`, pmaports \`${{ needs.packages.outputs.pmaports }}\`
          - Vendor firmware is not included: install yours from your own stock firmware (docs/RELEASES.md)

          Verified on the device: ${{ needs.state.outputs.verified }}

          Fingerprint: \`${{ needs.state.outputs.fingerprint }}\`
          EOF
          )"
          ci/publish "$tag" "work/duranium-build/mkosi.output/$base" "$VERSION" $pre
