# The official release records on GitHub Pages
# (https://exynos-linux.github.io/samsung-gtactive3wifi/, config.toml update.pages): releases.json,
# channels/<id>.json and index.html, generated by ci/pages from the GitHub
# releases and their signed SHA256SUMS. Rebuilt after every image or
# boot-chain publish and every 6 hours, so it never lags the releases.
name: pages

on:
  workflow_run:
    workflows: [images, bootchain]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "ci/pages"
      - "scripts/tablet-remote"
      - "scripts/tablet-phosh"
      - "ci/channels"
      - "pmos/sysupdate-public-key.asc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Generate the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/pages site
          # the tablet's one-line remote-access setup (docs/INSTALL.md)
          cp scripts/tablet-remote site/remote
          cp scripts/tablet-phosh site/phosh
          # and the Tailscale build it installs (pinned in the script), for
          # networks that filter pkgs.tailscale.com
          v=$(sed -n 's/^V=//p' scripts/tablet-remote)
          sha=$(sed -n 's/^SHA=//p' scripts/tablet-remote)
          mkdir -p site/tools
          curl -fsSL -o "site/tools/tailscale_${v}_arm64.tgz" "https://pkgs.tailscale.com/stable/tailscale_${v}_arm64.tgz"
          echo "$sha  site/tools/tailscale_${v}_arm64.tgz" | sha256sum -c -
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
