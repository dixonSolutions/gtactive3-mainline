# The official release records on GitHub Pages
# (https://dixonsolutions.github.io/gtactive3-mainline/): releases.json,
# channels/<id>.json and index.html, generated by ci/pages from the GitHub
# releases and their signed SHA256SUMS. Rebuilt after every image or
# boot-chain publish and every 6 hours, so it never lags the releases.
name: pages

on:
  workflow_run:
    workflows: [images, bootchain]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "ci/pages"
      - "ci/channels"
      - "pmos/sysupdate-public-key.asc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Generate the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/pages site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
